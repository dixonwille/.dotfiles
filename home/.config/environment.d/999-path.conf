# 999-: after Ubuntu's /usr/lib/environment.d/99-environment.conf, which sets PATH
# outright (and snapd's 990-), so systemd's copy builds on it rather than losing it.
# My own scripts (home/.local/bin), and Rust's when rustup installed it there.
# For services and shells alike; zsh drops repeats (.zshenv's typeset -U path).
PATH=$HOME/.cargo/bin:$HOME/.local/bin:$PATH
