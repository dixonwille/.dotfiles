# This repo's editor tools: Lua (nvim config) and shell (bin/, install/).
# Nix tooling (nixd, nixfmt, statix, deadnix) has no release binaries for mise
# to install; for profile/, run nvim under `nix shell nixpkgs#nixd nixpkgs#nixfmt`.
[tools]
node = "lts" # runs bash-language-server
lua-language-server = "latest"
stylua = "latest"
"github:Kampfkarren/selene" = "latest"
"npm:bash-language-server" = "latest"
shellcheck = "latest"
shfmt = "latest"
